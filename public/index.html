<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const api=async(p,o)=>{const r=await fetch(p,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j};
const send=(p,b,m='PUT')=>api(p,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',sunrise:'<path d="M12 3v3M5.6 7.6l1.8 1.8M18.4 7.6l-1.8 1.8M3 16h2.5M18.5 16H21M7 16a5 5 0 0 1 10 0M3 20h18"/>',monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',bm:'<path d="M6 3h12v18l-6-4-6 4z"/>',bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 21h4"/>',set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',next:'<path d="M9 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.7 6.7A16.6 16.6 0 0 0 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',term:'<path d="M4 5h16v14H4zM8 10l3 2-3 2M13 15h4"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const ic=(n,c='ic')=>`<svg class="${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
document.querySelector('[data-act=bm]').innerHTML=ic('bm');$('#bell').innerHTML=ic('bell');document.querySelector('[data-act=settings]').innerHTML=ic('set');$('.next').innerHTML=ic('next');

const fb=n=>{n=n||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return(i?n.toFixed(n<10?2:1):n.toFixed(0))+' '+u[i]};

const hm=t=>new Date(t).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'刚刚':s<3600?Math.floor(s/60)+' 分钟前':s<86400?Math.floor(s/3600)+' 小时前':Math.floor(s/86400)+' 天前'};
const pct=o=>o&&o.total?100*o.used/o.total:0;
const col=p=>p>85?'var(--bad)':p>65?'var(--warn)':'var(--ok)';
const upc=v=>v==null?'—':v.toFixed(v===100?0:2)+'%';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2600)};

const isMob=()=>{try{return /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&innerWidth<900)}catch{return false}};
const bmShow=i=>!i.dev||i.dev===(isMob()?'mobile':'pc');
let cfg={servers:[],sites:[],bookmarks:[],ntfy:{}},st={servers:[],sites:[],alerts:[]},sel=ls.get('nbm.sel')||'overview',range='live',hc={},hov=0,ei=+ls.get('nbm.eng')||0;
const ENG=[['Google','https://www.google.com/search?q='],['Bing','https://www.bing.com/search?q='],['DuckDuckGo','https://duckduckgo.com/?q=']];if(ei>=ENG.length)ei=0;
const modalOpen=()=>$('#md').classList.contains('on');
const dotc=u=>u===true?'u':u===false?'d':'';

/* ---------- 组件 ---------- */
function ring(p,label,main,sub){const L=2*Math.PI*33;return`<div class="gc in"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="33" fill="none" style="stroke:rgba(var(--wf),.12)" stroke-width="8"/><circle cx="40" cy="40" r="33" fill="none" stroke="${col(p)}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(L*Math.min(p,100)/100).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">${p.toFixed(0)}%</text></svg><div><div class="l">${label}</div><b>${main}</b><div class="v">${sub}</div></div></div>`}
function hb(a,cls='',n=60){a=a||[];const e=Math.max(0,n-a.length);return`<div class="hb ${cls}">${'<i></i>'.repeat(e)}${a.slice(-n).map(v=>`<i class="${v[0]?'g1':'r1'}" title="${v[0]?'正常 '+v[1]+' ms':'失败'}"></i>`).join('')}</div>`}
function bar(l,p){return`<div class="bar"><span>${l}</span><div class="tr"><i style="width:${Math.min(p,100).toFixed(0)}%;background:${col(p)}"></i></div><b>${p.toFixed(0)}%</b></div>`}
function spk(d,c='#6ea8ff'){d=d||[];if(d.length<2)return'<svg class="spk"></svg>';const m=Math.max(1,...d),n=d.length;return`<svg class="spk" viewBox="0 0 100 22" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${d.map((v,i)=>`${(i/(n-1)*100).toFixed(1)},${(20-v/m*18).toFixed(1)}`).join(' ')}"/></svg>`}
const niceB=v=>{const k=Math.max(0,Math.floor(Math.log(v)/Math.log(1024))),u=Math.pow(1024,k),x=v/u;return([1,2,5,10,20,50,100,200,500,1000].find(n=>n>=x)||1000)*u};
const niceMax=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),r=v/p;return(r<=1?1:r<=2?2:r<=5?5:10)*p};
let cid=0;
function chart(el,{series,t,max,min,fmt,lab,bytes}){
 const n=Math.max(0,...series.map(s=>s.d.length));
 if(n<2){el.innerHTML='<div class="empty">数据积累中,稍等几十秒…</div>';return}
 const top=Math.max(min||1,...series.flatMap(s=>s.d))*1.1,mx=max||(bytes?niceB(top):niceMax(top)),W=el.clientWidth||560,H=170,pr=8,pt=8,pb=22,pl=Math.max(40,fmt(mx).length*6.4+14);
 const X=i=>pl+(W-pl-pr)*i/(n-1),Y=v=>pt+(H-pt-pb)*(1-Math.min(v,mx)/mx),id='g'+(++cid);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs>${series.map((q,i)=>`<linearGradient id="${id}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${q.c}" stop-opacity=".35"/><stop offset="1" stop-color="${q.c}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
 for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:rgba(var(--wf),.09)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" style="fill:var(--mut)" font-size="11">${fmt(v)}</text>`}
 series.forEach((q,i)=>{const pts=q.d.map((v,j)=>`${X(j).toFixed(1)},${Y(v).toFixed(1)}`);s+=`<path d="M${pts.join('L')}L${X(q.d.length-1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="url(#${id}${i})"/><polyline points="${pts.join(' ')}" fill="none" stroke="${q.c}" stroke-width="1.8" stroke-linejoin="round"/>`});
 const L=t?[hm(t[0]),hm(t[Math.floor(n/2)]),hm(t[n-1])]:lab;
 s+=`<text x="${pl}" y="${H-5}" style="fill:var(--mut)" font-size="11">${L[0]}</text><text x="${(pl+W-pr)/2}" y="${H-5}" text-anchor="middle" style="fill:var(--mut)" font-size="11">${L[1]||''}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" style="fill:var(--mut)" font-size="11">${L[2]||L[1]}</text><line id="${id}v" y1="${pt}" y2="${H-pb}" style="display:none;stroke:rgba(var(--wf),.4)"/></svg><div class="tip"></div>`;
 el.innerHTML=s;const tip=$('.tip',el),vl=$('#'+id+'v',el);
 el.onmouseenter=()=>hov++;el.onmouseleave=()=>{hov=Math.max(0,hov-1);tip.style.display='none';vl.style.display='none'};
 el.onmousemove=e=>{const r=el.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,i=Math.max(0,Math.min(n-1,Math.round((px-pl)/(W-pl-pr)*(n-1))));
  vl.setAttribute('x1',X(i));vl.setAttribute('x2',X(i));vl.style.display='';
  tip.innerHTML=`<div style="color:var(--mut)">${t?hm(t[i]):(lab[0]==='5 分钟前'?Math.round((n-1-i)*5)+' 秒前':'')}</div>`+series.map(q=>`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${q.c};margin-right:6px"></i>${q.n} ${fmt(q.d[i]||0,1)}</div>`).join('');
  tip.style.display='block';const left=X(i)*r.width/W;tip.style.left=(left>r.width/2?left-tip.offsetWidth-12:left+12)+'px'};
}

/* ---------- 渲染 ---------- */
const cur=()=>st.servers.find(x=>x.id===sel);
/* 公网 IP:优先用手动填写的,否则用探针上报的;默认打码,点眼睛才显示(只在当前页面有效,刷新后又是打码) */
const ipShow=new Set();
const ipOf=s=>{const m=(cfg.servers||[]).find(x=>x.id===s.id);return(m&&m.ip)||(s.stats&&s.stats.pub)||''};

function renderSum(){
 const sv=st.servers,on=sv.filter(x=>x.up).length,ws=st.sites.filter(x=>x.check),wo=ws.filter(x=>x.up).length;
 const bad=[...sv.filter(x=>x.up===false).map(x=>x.name),...ws.filter(x=>x.up===false).map(x=>x.name)];

 const n=(st.alerts||[]).filter(a=>Date.now()-a.t<864e5&&(a.type==='down'||a.type==='warn')).length;
 let b=$('#bell .badge');if(n){if(!b){b=document.createElement('i');b.className='badge';$('#bell').appendChild(b)}b.textContent=n}else if(b)b.remove();
}

}
function overview(){
 return`<div class="ov">${st.servers.map(s=>{const t=s.stats;
  return`<button class="sc g in" data-act="tab" data-id="${esc(s.id)}"><h4><i class="dot ${dotc(s.up)}"></i>${esc(s.name)}${sshOn(s.id)?`<span class="sshb" role="button" tabindex="0" data-act="ssh" data-id="${esc(s.id)}" title="打开 SSH 终端">${ic('term')}SSH</span>`:''}</h4><div class="sub">${t?esc(t.os)+' · 运行 '+fup(t.uptime):s.up===false?'离线:'+esc(s.err):'等待数据…'}</div><div class="ipl">公网 IP ${ipHtml(s)}</div>${t?bar('CPU',t.cpu)+bar('内存',pct(t.mem))+bar('磁盘',pct(t.disk))+`<div class="ft"><span>↓ ${fsp(t.net.rxs)}&nbsp; ↑ ${fsp(t.net.txs)}</span><span>${upc(s.up24)}</span></div>`:''}${hb(s.hb,'s',40)}</button>`}).join('')}
  <button class="addcard" data-act="addServer"><div>${ic('plus','ic" style="width:26px;height:26px')}<div style="margin-top:8px">添加服务器</div></div></button></div>`;
}
function detail(s){
 const t=s.stats,head=`<div class="dh"><div><h2>${esc(s.name)}<span class="pill ${s.up?'':'d'}">${s.up?'在线':s.up===false?'离线':'等待中'}</span></h2><div class="sub">${t?`${esc(t.os)} · 内核 ${esc(t.kernel)} · ${t.cores} 核 · 已运行 ${fup(t.uptime)}`:s.remote?esc(s.url):'本机'}</div></div><div class="acts"><button class="bt sm" data-act="ssh" data-id="${esc(s.id)}">${ic('term')} SSH</button><button class="bt s sm" data-act="editServer" data-id="${esc(s.id)}">编辑</button></div></div>`;

async function termOpen(id){
 const s=(cfg.servers||[]).find(x=>x.id===id);if(!s)return;
 if(!s.ssh||!s.ssh.enabled){toast('这台服务器还没开启 SSH,请先在这里设置');return serverForm(id)}
 if(cfg.sshReady==='nopass')return toast('要先在 docker-compose.yml 里设置 SSH_PASS(SSH 密码)才能用网页 SSH');

 openModal('SSH · '+s.name,`<div class="row" id="t_unlock" style="display:none"><input class="tin" id="t_upw" type="password" name="nbm-ssh-gate" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" placeholder="输入 SSH 密码,回车确认"><button class="bt sm" id="t_ugo">确认</button></div><div class="row" id="t_ask" style="display:none"><input class="tin" id="t_pw" type="password" autocomplete="new-password" placeholder="输入 ${esc(s.ssh.user||'root')} 的 SSH 密码,回车连接"><button class="bt sm" id="t_go">连接</button></div><div id="term"></div><div class="tkeys">${TKEYS.map((k,i)=>`<button data-act="tkey" data-i="${i}">${k[0]}</button>`).join('')}</div>`,
  '<span class="tst" id="t_st">连接中…</span><span class="sp"></span><button class="bt s" id="t_re">重新连接</button><button class="bt s" data-act="close">关闭</button>',true);
 const st=$('#t_st'),mark=(c,t)=>{st.className='tst '+c;st.textContent=t};
 const connect=async pw=>{
  termStop();mark('','连接中…');
  try{await loadXterm()}catch(e){return mark('no',e.message)}
  const el=$('#term');if(!el)return;el.innerHTML='';
  const term=new Terminal({cursorBlink:true,fontSize:14,scrollback:5000,fontFamily:'ui-monospace,Menlo,Consolas,"Courier New",monospace',theme:{background:'#070b16',foreground:'#dbe4ff',cursor:'#dbe4ff'}}),fit=new FitAddon.FitAddon();

  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/ssh?id='+encodeURIComponent(id));let opened=false;

   else if(m.t==='info')term.writeln('\x1b[90m'+m.m+'\x1b[0m');
   else if(m.t==='err'){mark('no','连接失败');term.writeln('\r\n\x1b[31m'+m.m+'\x1b[0m')}
   else if(m.t==='exit'){mark('','已断开');term.writeln('\r\n\x1b[90m[连接已关闭,可点「重新连接」]\x1b[0m')}};
  ws.onclose=()=>{if(TM!==T)return;if(!opened){mark('no','无法建立连接');term.writeln('\x1b[31m无法连接到面板的 SSH 通道。请检查:面板是否已设置登录密码;如果走了反向代理,要开启 WebSocket 支持并保留 Host 头。\x1b[0m')}else if(st.textContent==='连接中…'||st.textContent==='已连接')mark('','已断开')};

  let raf=0;T.ro=new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{fit.fit()}catch{}})});T.ro.observe(el)};
 const needUnlock=()=>{termStop();$('#t_ask').style.display='none';$('#t_unlock').style.display='flex';$('#t_upw').value='';$('#t_upw').focus();mark('','请输入 SSH 密码')};

 const gate=()=>{if(!getTk())return needUnlock();if(!ask)return connect();$('#t_ask').style.display='flex';$('#t_pw').value='';$('#t_pw').focus();mark('','等待输入密码')};

 if(ask){$('#t_pw').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};$('#t_go').onclick=go}
 $('#t_upw').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();unlock()}};$('#t_ugo').onclick=unlock;
 $('#t_re').onclick=gate;gate()}
