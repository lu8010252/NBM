# 探针:给被监控的服务器用。只开 /api/stats,没有网页、设置、壁纸和告警。
# 部署: docker compose -f docker-compose.agent.yml up -d
name: nbm-agent
services:
  nbm-agent:
    image: ghcr.io/lu8010252/nbm:latest
    container_name: nbm-agent
    restart: unless-stopped
    network_mode: host
    pid: host                   # 让面板看到宿主机的进程,悬停 CPU/内存/交换分区时才能显示进程占用明细
    mem_limit: 64m
    environment:
      - MODE=agent
      - PORT=8060
      - TOKEN=CHANGE_ME         # 自己定一个密钥,然后在主面板「添加服务器」里填同一个
      - DISK_PATH=/host
      - TZ=Asia/Shanghai
    volumes:
      - /:/host:ro
